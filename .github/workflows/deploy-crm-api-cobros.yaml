name: Deploy COBROS-02 (CRM API + cartera-back)

# Construye y empuja las imágenes de la rama COBROS-02 al ECR público y dispara
# el redeploy en Coolify. Dos apps, cada una con su instancia aparte, separadas
# de las principales para no arrastrarles cambios en curso:
#   - CRM API: la que consume el bot de WhatsApp de SimpleTech.
#   - cartera-back: sirve contra el schema sandbox `cartera_cobros2` (el
#     rediseño de buckets/asesores de COBROS-02), no contra `cartera`.
#
# Cada app se construye SOLO si su código cambió: el job `cambios` mira qué
# tocó el push y los demás se saltan solos. Antes se reconstruían las dos
# siempre, así que un commit que solo tocaba cartera reiniciaba también el CRM
# API que está usando SimpleTech. Mismo patrón que deploy-cartera-dev.yaml.
#
# Hace lo mismo que apps/crm/apps/server/deployServer.sh y
# apps/cartera-back/deploy-dev.sh (mismos Dockerfiles), pero automático y con
# tag por commit.
#
# Ver docs/features/bot-whatsapp-cobros/despliegue-dev.md
on:
  push:
    branches: ["COBROS-02"]
    paths:
      - "apps/crm/apps/server/**"
      - "packages/sms/**"
      - "packages/simpletech/**"
      - "packages/infornet/**"
      - "packages/email/**"
      - "apps/cartera-back/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/deploy-crm-api-cobros.yaml"
  workflow_dispatch: {} # permite dispararlo a mano desde la pestaña Actions

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: public.ecr.aws/a6w8m2u2

permissions:
  contents: read

jobs:
  # 0) Qué app tocó este push. Sin esto, cualquier commit reconstruye las dos.
  cambios:
    name: Detectar cambios
    runs-on: ubuntu-latest
    outputs:
      crm: ${{ steps.filtro.outputs.crm }}
      cartera: ${{ steps.filtro.outputs.cartera }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filtro
        with:
          # Comparar contra el commit anterior de ESTA rama; sin esto compara
          # contra la default (main) y, como COBROS-02 lleva meses de trabajo
          # aparte, todo push "cambiaría" las dos apps.
          base: ${{ github.ref }}
          # El workflow entra en los dos filtros: si cambia cómo se construye o
          # se despliega, hay que rehacer ambas imágenes para probarlo.
          filters: |
            crm:
              - 'apps/crm/apps/server/**'
              - 'packages/sms/**'
              - 'packages/simpletech/**'
              - 'packages/infornet/**'
              - 'packages/email/**'
              - '.github/workflows/deploy-crm-api-cobros.yaml'
            cartera:
              - 'apps/cartera-back/**'
              - 'packages/email/**'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/deploy-crm-api-cobros.yaml'

  # ─── CRM API ────────────────────────────────────────────────────────────
  # 1) Barrera barata antes de publicar: la API la consume un tercero, así que
  # no conviene subir una imagen que ni compila.
  verificar-crm:
    name: CRM API · Tipos y pruebas
    needs: cambios
    # En dispatch manual no hay diff que mirar: se construye igual, que para eso
    # sirve — forzar un redeploy después de un run fallido.
    if: needs.cambios.outputs.crm == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Las dependencias del server NO se hoistean a apps/crm/node_modules: hay
      # que instalarlas dentro de su propio directorio, igual que hace el
      # Dockerfile. Instalar en apps/crm deja a `tsc` sin drizzle-orm.
      # El server no tiene lockfile propio, así que va sin --frozen-lockfile.
      - name: Instalar dependencias del server
        working-directory: apps/crm/apps/server
        run: bun install

      - name: Revisar tipos
        working-directory: apps/crm/apps/server
        run: bunx tsc --noEmit

      - name: Pruebas del bot de cobros
        working-directory: apps/crm/apps/server
        run: bun test src/lib/bot-cobros/

  # 2) Imagen → cci/crm-api-cobros:latest
  desplegar-crm:
    name: CRM API · Construir y desplegar
    needs: [cambios, verificar-crm]
    if: needs.cambios.outputs.crm == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Por job (no global, ver nota al final del archivo): un push viejo que
    # todavía está verificando esta app no debe cancelarse por un push que
    # solo tocó cartera-back, y viceversa. Dentro de esta app sí debe
    # cancelar: si estuviera solo en este job y no en `verificar-crm`, un run
    # viejo que todavía verifica publicaría su imagen encima al terminar,
    # dejando `latest` en un commit anterior.
    concurrency:
      group: deploy-cobros02-crm
      cancel-in-progress: true
    env:
      IMAGEN: cci/crm-api-cobros
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a ECR Public (podman)
        run: |
          aws ecr-public get-login-password --region $AWS_REGION \
            | podman login --username AWS --password-stdin public.ecr.aws

      - name: Construir y empujar
        run: |
          podman build -f apps/crm/apps/server/Dockerfile . \
            -t $ECR_REGISTRY/$IMAGEN:latest \
            -t $ECR_REGISTRY/$IMAGEN:${{ github.sha }}
          podman push $ECR_REGISTRY/$IMAGEN:latest
          podman push $ECR_REGISTRY/$IMAGEN:${{ github.sha }}

      - name: Redeploy en Coolify
        run: |
          curl --fail-with-body --request POST \
            "${{ secrets.COOLIFY_WEBHOOK_CRM_API_COBROS }}" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

  # ─── cartera-back ───────────────────────────────────────────────────────
  # Sin job de tipos/tests separado: deploy-cartera-dev.yaml tampoco lo tiene
  # para esta app — el `bun install` real ocurre dentro del Dockerfile (ver
  # Dockerfile paso 2). La única barrera antes de publicar es el smoke test
  # de Puppeteer dentro de la imagen ya construida, mismo patrón que ese
  # workflow.
  desplegar-cartera:
    name: cartera-back · Construir y desplegar
    needs: cambios
    if: needs.cambios.outputs.cartera == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-cobros02-cartera
      cancel-in-progress: true
    env:
      IMAGEN: cci/cartera-api-cobros
    steps:
      - uses: actions/checkout@v4

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a ECR Public (podman)
        run: |
          aws ecr-public get-login-password --region $AWS_REGION \
            | podman login --username AWS --password-stdin public.ecr.aws

      # Contexto en la raíz del monorepo: el Dockerfile copia packages/email y
      # apps/cartera-back (igual que deploy-prod.yaml, a diferencia de
      # deploy-dev.sh que usa `../..` desde dentro de la app).
      - name: Construir y empujar
        run: |
          podman build -f apps/cartera-back/Dockerfile . \
            -t $ECR_REGISTRY/$IMAGEN:latest \
            -t $ECR_REGISTRY/$IMAGEN:${{ github.sha }}
          echo "Running cartera-back Puppeteer smoke test inside the built image"
          podman run --rm $ECR_REGISTRY/$IMAGEN:${{ github.sha }} bun run smoke:puppeteer
          podman push $ECR_REGISTRY/$IMAGEN:latest
          podman push $ECR_REGISTRY/$IMAGEN:${{ github.sha }}

      - name: Redeploy en Coolify
        run: |
          curl --fail-with-body --request POST \
            "${{ secrets.COOLIFY_WEBHOOK_CARTERA_API_COBROS }}" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

# Nota sobre concurrencia: acá va por job (agrupada por app: cobros02-crm /
# cobros02-cartera), a diferencia de la versión anterior de este archivo que
# la tenía a nivel de workflow cuando solo existía el CRM API. Con dos apps
# independientes, un grupo global haría que un push que solo toca cartera
# cancele un deploy del CRM API en curso (y viceversa). El patrón por-app es
# el mismo que usa deploy-cartera-dev.yaml.
