server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Sin esto salen ~470 KB de JS sin comprimir a un teléfono en el predio,
    # que es justo el escenario que apunta esta app.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Handle SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets. add_header no es acumulativo entre server y
    # location: si esta location define el suyo, descarta los del bloque
    # server de arriba, así que hay que repetirlos acá.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
}
