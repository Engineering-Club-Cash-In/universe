services:
  config-init:
    build:
      context: ..
      dockerfile: config-renderer.Dockerfile
    image: cci/victorialogs-config-renderer:1.0.0
    # Extensión Coolify: el init termina correctamente y no participa en healthchecks.
    exclude_from_hc: true
    command:
      - agent
      - --secrets-dir
      - /run/secrets
      - --template
      - /opt/iac/vector.template.yaml
      - --output
      - /runtime/vector.yaml
      - --endpoint
      - ${VICTORIALOGS_ENDPOINT:?set VICTORIALOGS_ENDPOINT}
      - --host
      - ${LOG_HOST:?set LOG_HOST}
      - --environment
      - ${LOG_ENVIRONMENT:?set LOG_ENVIRONMENT}
    secrets:
      - ingest_username
      - ingest_password
    volumes:
      - vector-config:/runtime
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 64m
    cpus: 0.10
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  vector:
    image: timberio/vector:0.57.0-debian@sha256:959cde6edd73686d3af9edea4e2fd52ddb03e29725aa25c8cf9c6635c0ce5703
    command:
      - --config
      - /etc/vector/vector.yaml
    volumes:
      - vector-config:/etc/vector:ro
      - vector-data:/var/lib/vector
      - ${CONTAINER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
    depends_on:
      config-init:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 256m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  vector-config:
  vector-data:

secrets:
  ingest_username:
    environment: VECTOR_INGEST_USERNAME
  ingest_password:
    environment: VECTOR_INGEST_PASSWORD
